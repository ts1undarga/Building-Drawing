<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Drawing 2</title>

<style>
    #big_window {
        position: absolute;
        width: 600px;
        height: 600px;
        background-color: skyblue;
        border: 1px solid black;
    }

    #building {
        position: absolute;
        top: 100px;
        width: 350px;
        height: 500px;
        background: linear-gradient(to right, rgb(245, 239, 220), rgb(181, 178, 178));
        border: 1px solid black;
        overflow: hidden;
    }

    #building2 {
        position: absolute;
        top: 300px;
        right: 0px;
        width: 250px;
        height: 300px;
        background: linear-gradient(to right, rgb(209, 144, 130), rgb(75, 37, 37));
        border: 1px solid black;
        overflow: hidden;
    }

    .window {
        width: 50px;
        height: 60px;
        background-color: grey;
        margin: 10px;
        border: 3px solid black;
        box-shadow: inset 4px 4px 8px black;
    }

    #window1 {
        position: absolute;
        top: 50px;
        left: 50px;
    }

    #window2 {
        position: absolute;
        top: 50px;
        left: 150px;
        background-color: rgb(177, 177, 167);

    }

    #window3 {
        position: absolute;
        top: 50px;
        left: 250px;
        background-color: rgb(248, 248, 234);
    }

    .line {
        position: absolute;
        width: 500px;
        height: 1px;
        background-color: black;
    }

    #line1 {
        top: 150px;
    }

    #line2 {
        top: 300px;
    }

    #sun{
        background-color: rgb(253, 255, 244);
        position: absolute;
        width: 1000px;
        height: 1000px;
        top: 200px;
        left: 90px;
        transform: rotate(45deg);
        filter: blur(20px);
        opacity: 60%;
    }
</style>

</head>
<body>
<div id="big_window">

    <div id="building2">
        <p id="window1" class="window"></p> 
        <p id="window2" class="window"></p> 
    </div>

    <div id="building">
        <p id="window1" class="window"></p> 
        <p id="window2" class="window"></p> 
        <p id="window3" class="window"></p> 
        <p id="line1" class="line"></p>
        <p id="line2" class="line"></p>

    </div>

    <div id="sun"></div>

</div>
</body>
</html>
